<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Presupuesto</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--txt:#f1f5f9;--mut:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--acc:#6366f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 2px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px;text-transform:capitalize}
.icon-btn{background:var(--card);border:0;color:var(--txt);width:42px;height:42px;border-radius:12px;font-size:20px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:20px;padding:18px;margin:10px 0 16px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.hero .row{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-top:6px}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 2px 8px;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.cat{cursor:pointer}
.cat .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat .name{font-weight:600}
.cat .left{font-weight:700}
.bar{height:9px;background:var(--card2);border-radius:99px;margin:10px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .3s}
.meta{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.fixed{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card2)}
.fixed:last-child{border:0}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;box-shadow:0 8px 24px #0008}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--card2);border:2px solid transparent;color:var(--txt);border-radius:99px;padding:8px 12px;font-size:15px}
.chip.on{border-color:var(--acc);background:#312e81}
input[type=text],input[type=number],input[type=date]{width:100%;background:var(--bg);border:1px solid var(--card2);color:var(--txt);border-radius:12px;padding:13px;font-size:18px;margin-bottom:10px}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:4px}
.btn.sec{background:var(--card2);margin-top:8px}
.btn.danger{background:#7f1d1d}
.exp{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--card2);gap:8px}
.exp small{color:var(--mut);display:block}
.exp button{background:none;border:0;color:var(--bad);font-size:18px;padding:6px}
.set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.set-row input[type=text]{flex:2;margin:0;font-size:15px;padding:10px}
.set-row input[type=number]{flex:1;margin:0;font-size:15px;padding:10px}
.set-row label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;z-index:20;padding:14px;border-radius:14px;font-weight:600;text-align:center;box-shadow:0 8px 24px #0008}
.empty{color:var(--mut);text-align:center;padding:16px}
.share{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px;font-size:15px}
.share input{width:22px;height:22px;flex:none}
.share small{display:block;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <div><h1>💰 Presupuesto</h1><div class="sub" id="monthLabel"></div></div>
  <button class="icon-btn" id="btnSettings" aria-label="Ajustes">⚙️</button>
</header>
<div id="app"></div>
<button class="fab" id="btnAdd">➕ Añadir gasto</button>

<script>
const KEY = 'presupuesto_v3';
const fmt = n => new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR'}).format(n || 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const monthKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const monthIdx = k => { const [y, m] = k.split('-').map(Number); return y * 12 + m; };

function defaults() {
  return {
    month: '2026-10',
    income: 984.58,
    fixed: [
      {id: uid(), emoji: '🏠', name: 'Piso', amount: 350, counted: false, paid: true},
      {id: uid(), emoji: '📱', name: 'Digi', amount: 10, counted: false, paid: true},
      {id: uid(), emoji: '🚗', name: 'Coche', amount: 307.09, counted: true, paid: false},
      {id: uid(), emoji: '📺', name: 'Netflix', amount: 8.99, counted: true, paid: false},
      {id: uid(), emoji: '🎧', name: 'Spotify', amount: 3.50, counted: true, paid: false},
      {id: uid(), emoji: '🏋️', name: 'Gimnasio', amount: 45, counted: true, paid: false}
    ],
    tricount: {base: 306.06},
    reminders: [
      {id: uid(), emoji: '🤝', name: 'Contribución', amount: 95}
    ],
    cats: [
      {id: 'viaje', emoji: '✈️', name: 'Viaje', budget: 200, carry: true, roll: 0},
      {id: 'inversion', emoji: '📈', name: 'Inversión', budget: 60, carry: false, roll: 0, tracker: true},
      {id: 'concierto', emoji: '🎵', name: 'Concierto', budget: 100, carry: true, roll: 0},
      {id: 'comida', emoji: '🍔', name: 'Comida', budget: 100, carry: false, roll: 0},
      {id: 'vida', emoji: '🥳', name: 'Vida', budget: 160, carry: false, roll: 0}
    ],
    expenses: [
      {id: uid(), cat: 'comida', amount: 51.51, note: 'compartido', shared: true, ts: Date.now()},
      {id: uid(), cat: 'vida', amount: 6, note: '', ts: Date.now()},
      {id: uid(), cat: 'vida', amount: 11.17, note: '', ts: Date.now()}
    ],
    history: [],
    debts: []
  };
}

let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.cats) S = defaults();
  normalize();
  rollover();
  save();
}
// Migra datos de versiones anteriores sin perder nada
function normalize() {
  if (!S.reminders) S.reminders = [];
  if (S.income == null) S.income = 0;
  if (!S.tricount) {
    S.tricount = {base: 0};
    const tr = S.reminders.find(r => /tricount/i.test(r.name));
    if (tr) {
      S.reminders = S.reminders.filter(r => r !== tr);
      const sh = S.expenses.find(e => e.cat === 'comida' && e.amount === 51.51 && !e.shared);
      if (sh) { sh.shared = true; S.tricount.base = Math.round((tr.amount + half(sh.amount)) * 100) / 100; }
      else S.tricount.base = tr.amount;
    }
  }
  if (!Array.isArray(S.debts)) S.debts = [];
  S.debts.forEach(d => { if (!Array.isArray(d.payments)) d.payments = []; });
  const inv = S.cats.find(c => c.id === 'inversion');
  if (inv && inv.tracker == null) inv.tracker = true;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// Cambio de mes: archiva gastos y arrastra sobrantes de las categorías con "acumula"
function rollover() {
  const now = monthKey();
  if (S.month === now) return;
  let steps = monthIdx(now) - monthIdx(S.month);
  if (steps <= 0) return;
  S.history.push({month: S.month, expenses: S.expenses});
  S.cats.forEach(c => {
    const spent = spentOf(c.id);
    let roll = c.carry ? (c.budget + (c.roll || 0) - spent) : 0;
    for (let i = 1; i < steps; i++) roll = c.carry ? roll + c.budget : 0;
    c.roll = Math.round(roll * 100) / 100;
  });
  const tDebt = tricountDebt();
  S.expenses = [];
  S.fixed = S.fixed.filter(f => !f.oneoff).map(f => ({...f, counted: true, paid: false}));
  S.reminders.forEach(r => S.fixed.push({id: uid(), emoji: r.emoji, name: r.name, amount: r.amount, counted: true, paid: false, oneoff: true}));
  S.reminders = [];
  if (tDebt > 0) S.fixed.push({id: uid(), emoji: '💳', name: 'Tricount', amount: tDebt, counted: true, paid: false, oneoff: true});
  S.tricount.base = Math.min(0, tDebt);
  S.month = now;
}

const half = a => Math.round(a * 50 + 1e-6) / 100;
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const rawInOf = id => S.expenses.filter(e => e.cat === id && e.kind !== 'out').reduce((a, e) => a + e.amount, 0);
const winsOf = id => S.expenses.filter(e => e.cat === id && e.kind === 'out').reduce((a, e) => a + e.amount, 0);
// Gasto de una categoría. En las de juego/inversión solo cuenta la pérdida neta (metido − ganado, mínimo 0)
const spentOf = id => {
  const c = S.cats.find(x => x.id === id), r = rawInOf(id);
  return c && c.tracker ? Math.max(0, Math.round((r - winsOf(id)) * 100) / 100) : r;
};
// Bloqueo: pérdida neta ha llegado al límite de la categoría
const invBlocked = c => !!c.tracker && spentOf(c.id) >= availOf(c) - 0.005;
// Deudas
const rd = n => Math.round(n * 100) / 100;
const debtPaid = d => rd(d.payments.reduce((a, p) => a + p.amount, 0));
const debtLeft = d => Math.max(0, rd(d.amount - debtPaid(d)));
const debtTotal = dir => rd(S.debts.filter(d => d.dir === dir).reduce((a, d) => a + debtLeft(d), 0));
const dayStr = t => { const d = new Date(t); return monthKey(d) + '-' + String(d.getDate()).padStart(2, '0'); };
const dShort = t => new Date(t).toLocaleDateString('es-ES', {day: 'numeric', month: 'short'});
// Pagos de deudas marcados "suma al presupuesto" en el mes actual (cobros suman, pagos restan)
const debtBudgetDelta = () => rd(S.debts.reduce((a, d) => a + d.payments.reduce((b, p) =>
  b + (p.budget && monthKey(new Date(p.ts)) === S.month ? (d.dir === 'owed' ? p.amount : -p.amount) : 0), 0), 0));
let debtTab = 'owed';
const sharedOffset = () => Math.round(S.expenses.filter(e => e.shared).reduce((a, e) => a + half(e.amount), 0) * 100) / 100;
const tricountDebt = () => Math.round((S.tricount.base - sharedOffset()) * 100) / 100;
const availOf = c => c.budget + (c.roll || 0);
const pctOf = c => { const a = availOf(c); return a > 0 ? spentOf(c.id) / a * 100 : (spentOf(c.id) > 0 ? 101 : 0); };
const colorOf = p => p > 100 ? 'var(--bad)' : p >= 80 ? 'var(--warn)' : 'var(--ok)';

function render() {
  document.getElementById('monthLabel').textContent =
    new Date(S.month + '-01T12:00:00').toLocaleDateString('es-ES', {month: 'long', year: 'numeric'});
  const fixedTotal = S.fixed.filter(f => f.counted).reduce((a, f) => a + f.amount, 0);
  const varBudget = S.cats.reduce((a, c) => a + availOf(c), 0);
  const varSpent = S.cats.reduce((a, c) => a + spentOf(c.id), 0);
  const assigned = S.cats.reduce((a, c) => a + c.budget, 0);
  const extra = debtBudgetDelta();
  const incomeTotal = S.income + extra;
  const free = Math.round((incomeTotal - fixedTotal - assigned) * 100) / 100;
  const left = varBudget - varSpent;
  const pct = varBudget > 0 ? Math.min(100, varSpent / varBudget * 100) : 0;

  let h = `<div class="hero">
    <div style="font-size:13px;opacity:.85">Te queda para variables</div>
    <div class="big">${fmt(left)}</div>
    <div class="bar" style="background:#ffffff33"><i style="width:${pct}%;background:#fff"></i></div>
    <div class="row"><span>Gastado ${fmt(varSpent)}</span><span>de ${fmt(varBudget)}</span></div>
  </div>
  <div class="card">
    <div class="fixed"><span>💰 Dinero del mes${extra ? ' <small style="color:var(--mut)">· incl. ' + sgn(extra) + ' de deudas</small>' : ''}</span><b>${fmt(incomeTotal)}</b></div>
    <div class="fixed"><span>🔒 Obligatorios pendientes</span><span>− ${fmt(fixedTotal)}</span></div>
    <div class="fixed"><span>💸 Variables asignadas</span><span>− ${fmt(assigned)}</span></div>
    <div class="fixed"><span>${free < 0 ? '⚠️ Te faltan' : '✅ Sin asignar'}</span><b style="color:${free < 0 ? 'var(--bad)' : 'var(--ok)'}">${fmt(Math.abs(free))}</b></div>
  </div>`;

  h += `<h2><span>Variables</span></h2>`;
  S.cats.forEach(c => {
    const sp = spentOf(c.id), av = availOf(c), p = pctOf(c), rest = av - sp;
    const wins = winsOf(c.id), inn = rawInOf(c.id), bal = Math.round((wins - inn) * 100) / 100;
    h += `<div class="card cat" data-cat="${esc(c.id)}">
      <div class="top"><span class="name">${esc(c.emoji)} ${esc(c.name)}</span>
      <span class="left" style="color:${colorOf(p)}">${rest < 0 ? '−' : ''}${fmt(Math.abs(rest))}</span></div>
      <div class="bar"><i style="width:${Math.min(100, p)}%;background:${colorOf(p)}"></i></div>
      <div class="meta"><span>${c.tracker ? 'Pérdida ' : ''}${fmt(sp)} de ${fmt(av)}${c.roll ? ' (incl. ' + fmt(c.roll) + ' arrastrado)' : ''}</span><span>${Math.round(p)}%</span></div>
      ${c.tracker && (inn || wins) ? `<div class="meta" style="margin-top:6px"><span>Metido ${fmt(inn)} · Ganado ${fmt(wins)}</span><b style="color:${bal >= 0 ? 'var(--ok)' : 'var(--bad)'}">Balance ${sgn(bal)}</b></div>` : ''}
    </div>`;
  });

  h += `<h2><span>🔒 Obligatorios</span><span>${fmt(fixedTotal)}</span></h2><div class="card">`;
  h += S.fixed.map(f => `<div class="fixed" data-fix="${esc(f.id)}" style="cursor:pointer"><span>${f.paid ? '✅' : '⬜'} ${esc(f.emoji)} ${esc(f.name)}${f.counted ? '' : ' <small style="color:var(--mut)">· ya pagado, no cuenta</small>'}</span><span style="${f.paid ? 'opacity:.55;text-decoration:line-through' : ''}">${fmt(f.amount)}</span></div>`).join('') || '<div class="empty">Sin obligatorios</div>';
  h += `</div><div class="meta" style="padding:0 4px"><span>Toca uno para marcarlo como pagado</span></div>`;

  const debt = tricountDebt(), off = sharedOffset();
  if (S.reminders.length || S.tricount.base || off) {
    const rt = S.reminders.reduce((a, r) => a + r.amount, 0) + Math.max(0, debt);
    h += `<h2><span>📌 Para el mes que viene</span><span>${fmt(rt)}</span></h2><div class="card">`;
    h += `<div class="fixed"><span>💳 Tricount <small style="color:var(--mut)">· deuda con tu pareja</small></span><b style="color:${debt < 0 ? 'var(--ok)' : 'inherit'}">${debt < 0 ? 'Te deben ' + fmt(-debt) : fmt(debt)}</b></div>`;
    if (off) h += `<div class="meta" style="padding:2px 0 8px"><span>Descontado por gastos compartidos: ${fmt(off)} (de ${fmt(S.tricount.base)})</span></div>`;
    h += S.reminders.map(r => `<div class="fixed"><span>${esc(r.emoji)} ${esc(r.name)}</span><span>${fmt(r.amount)}</span></div>`).join('');
    h += `</div>`;
  }

  // ---- Deudas ----
  const owedT = debtTotal('owed'), oweT = debtTotal('owe'), net = rd(owedT - oweT);
  const dl = S.debts.filter(d => d.dir === debtTab).sort((a, b) => (debtLeft(a) > 0 ? 0 : 1) - (debtLeft(b) > 0 ? 0 : 1) || b.ts - a.ts);
  h += `<h2><span>🤝 Deudas</span><span style="color:${net >= 0 ? 'var(--ok)' : 'var(--bad)'}">Saldo ${sgn(net)}</span></h2><div class="card">
    <div class="meta" style="margin-bottom:10px"><span>Te deben ${fmt(owedT)}</span><span>Debes ${fmt(oweT)}</span></div>
    <div class="chips" style="margin-bottom:8px">
      <button class="chip ${debtTab === 'owed' ? 'on' : ''}" data-dtab="owed">👋 Me deben</button>
      <button class="chip ${debtTab === 'owe' ? 'on' : ''}" data-dtab="owe">💳 Debo</button>
    </div>
    <div class="fixed"><b>${debtTab === 'owed' ? 'Total pendiente de cobro' : 'Total pendiente de pagar'}</b><b>${fmt(debtTab === 'owed' ? owedT : oweT)}</b></div>`;
  h += dl.map(d => {
    const left = debtLeft(d), done = left <= 0, paid = debtPaid(d);
    return `<div class="exp" data-debt="${esc(d.id)}" style="cursor:pointer;${done ? 'opacity:.55' : ''}"><div><span>${done ? '✅ ' : ''}${esc(d.person)}</span><small>${esc(d.concept || 'Sin concepto')} · ${dShort(d.ts)}${paid > 0 && !done ? ' · ' + (d.dir === 'owed' ? 'cobrado ' : 'pagado ') + fmt(paid) : ''}</small></div><div style="text-align:right"><b style="${done ? 'text-decoration:line-through' : ''}">${fmt(done ? d.amount : left)}</b>${!done && paid > 0 ? `<small>de ${fmt(d.amount)}</small>` : ''}</div></div>`;
  }).join('') || '<div class="empty">Nada por aquí</div>';
  h += `<button class="btn sec" data-adddebt="1">➕ Añadir deuda</button></div>`;

  document.getElementById('app').innerHTML = h;
}

// ---------- Hojas (modales) ----------
function openSheet(html) {
  closeSheet();
  const o = document.createElement('div');
  o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="sheet">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
  return o;
}
function closeSheet() { const o = document.getElementById('overlay'); if (o) o.remove(); }

function toast(msg, color) {
  const t = document.createElement('div');
  t.className = 'toast'; t.style.background = color; t.style.color = '#0f172a'; t.textContent = msg;
  document.body.appendChild(t);
  if (navigator.vibrate) navigator.vibrate(color === 'var(--bad)' ? [200, 100, 200] : 120);
  setTimeout(() => t.remove(), 3500);
}

function addSheet(preCat, preKind) {
  let sel = preCat || S.cats[0]?.id;
  let kind = preKind || 'in';
  const o = openSheet(`<h3>Añadir gasto <button class="icon-btn" id="x">✕</button></h3>
    <div class="chips">${S.cats.map(c => `<button class="chip ${c.id === sel ? 'on' : ''}" data-id="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</button>`).join('')}</div>
    <div class="chips" id="kindRow" style="display:none">
      <button class="chip" data-kind="in">💸 Meto</button>
      <button class="chip" data-kind="out">🏆 Gano</button>
    </div>
    <input type="number" id="amt" inputmode="decimal" step="0.01" placeholder="Importe (€)">
    <input type="text" id="note" placeholder="Nota (opcional)">
    <label class="share" id="shRow"><input type="checkbox" id="sh"><span>👥 Compartido con mi pareja<small id="shInfo">Resta la mitad de lo que debes del Tricount</small></span></label>
    <button class="btn" id="ok">Guardar gasto</button>`);
  const refresh = () => {
    const cat = S.cats.find(c => c.id === sel);
    const tr = !!(cat && cat.tracker);
    o.querySelector('#kindRow').style.display = tr ? 'flex' : 'none';
    o.querySelectorAll('[data-kind]').forEach(b => b.classList.toggle('on', b.dataset.kind === kind));
    o.querySelector('#shRow').style.display = tr ? 'none' : 'flex';
    const out = tr && kind === 'out';
    o.querySelector('#amt').placeholder = out ? 'Importe ganado / retirado (€)' : 'Importe (€)';
    o.querySelector('#ok').textContent = out ? 'Guardar ganancia' : (tr ? 'Guardar lo que meto' : 'Guardar gasto');
    const a = parseFloat(String(o.querySelector('#amt').value).replace(',', '.'));
    o.querySelector('#shInfo').textContent = o.querySelector('#sh').checked && a > 0
      ? 'Se descontarán ' + fmt(half(a)) + ' del Tricount'
      : 'Resta la mitad de lo que debes del Tricount';
  };
  o.querySelector('#x').onclick = closeSheet;
  o.querySelectorAll('.chip[data-id]').forEach(b => b.onclick = () => {
    sel = b.dataset.id;
    o.querySelectorAll('.chip[data-id]').forEach(x => x.classList.toggle('on', x === b));
    refresh();
  });
  o.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { kind = b.dataset.kind; refresh(); });
  o.querySelector('#sh').onchange = refresh;
  o.querySelector('#amt').oninput = refresh;
  refresh();
  o.querySelector('#ok').onclick = () => {
    const amount = parseFloat(String(o.querySelector('#amt').value).replace(',', '.'));
    if (!sel || !(amount > 0)) { o.querySelector('#amt').focus(); return; }
    const cat = S.cats.find(c => c.id === sel);
    const isOut = !!cat.tracker && kind === 'out';
    if (cat.tracker && !isOut && invBlocked(cat)) return toast(`⛔ ${cat.name}: has llegado al límite de pérdida (${fmt(availOf(cat))}). Registra ganancias para seguir.`, 'var(--bad)');
    const shared = !cat.tracker && o.querySelector('#sh').checked;
    const before = pctOf(cat);
    const exp = {id: uid(), cat: sel, amount: Math.round(amount * 100) / 100, note: o.querySelector('#note').value.trim(), ts: Date.now()};
    if (isOut) exp.kind = 'out';
    if (shared) exp.shared = true;
    S.expenses.push(exp);
    save(); closeSheet(); render();
    if (isOut) {
      const bal = Math.round((winsOf(cat.id) - rawInOf(cat.id)) * 100) / 100;
      return toast(`🏆 ${cat.name}: +${fmt(exp.amount)}. Balance del mes ${sgn(bal)}`, 'var(--ok)');
    }
    if (cat.tracker && invBlocked(cat)) return toast(`🔴 ${cat.name}: límite de pérdida alcanzado, no puedes meter más`, 'var(--bad)');
    const after = pctOf(cat);
    const rest = availOf(cat) - spentOf(cat.id);
    const extra = shared ? ` · Tricount −${fmt(half(exp.amount))}` : '';
    if (before <= 100 && after > 100) toast(`🔴 Te has pasado en ${cat.name} por ${fmt(-rest)}${extra}`, 'var(--bad)');
    else if (before < 90 && after >= 90 && after <= 100) toast(`🟠 ${cat.name}: ya llevas el 90% (quedan ${fmt(rest)})${extra}`, 'var(--warn)');
    else if (before < 80 && after >= 80 && after <= 100) toast(`🟠 ${cat.name}: ya llevas el 80% (quedan ${fmt(rest)})${extra}`, 'var(--warn)');
    else toast(`✅ ${cat.name}: quedan ${fmt(rest)}${extra}`, 'var(--ok)');
  };
  setTimeout(() => o.querySelector('#amt').focus(), 150);
}

function editExpense(expId, catId) {
  const c = S.cats.find(x => x.id === catId); if (!c) return;
  const exp = S.expenses.find(e => e.id === expId); if (!exp) return;
  const out = exp.kind === 'out';
  const o = openSheet(`<h3>${out ? '🏆 Editar ganancia' : (c.tracker ? '💸 Editar inversión' : '📝 Editar gasto')} <button class="icon-btn" id="x">✕</button></h3>
    <input type="number" id="amt" inputmode="decimal" step="0.01" placeholder="Importe (€)" value="${exp.amount}">
    <input type="text" id="note" placeholder="Nombre / nota (opcional)" value="${esc(exp.note || '')}">
    <button class="btn" id="ok">Guardar cambios</button>
    <button class="btn danger" id="del" style="margin-top:12px">🗑️ Borrar este ${out ? 'movimiento' : (c.tracker ? 'inversión' : 'gasto')}</button>`);
  o.querySelector('#x').onclick = closeSheet;
  o.querySelector('#ok').onclick = () => {
    const newAmount = parseFloat(String(o.querySelector('#amt').value).replace(',', '.'));
    if (!(newAmount > 0)) { o.querySelector('#amt').focus(); return; }
    exp.amount = Math.round(newAmount * 100) / 100;
    exp.note = o.querySelector('#note').value.trim();
    save(); closeSheet(); render(); catSheet(catId);
    toast(`✅ ${c.name}: cambios guardados`, 'var(--ok)');
  };
  o.querySelector('#del').onclick = () => {
    if (!confirm('¿Borrar este movimiento?')) return;
    S.expenses = S.expenses.filter(e => e.id !== expId);
    save(); render(); catSheet(catId);
  };
  setTimeout(() => o.querySelector('#amt').focus(), 150);
}

function catSheet(id) {
  const c = S.cats.find(x => x.id === id); if (!c) return;
  const list = S.expenses.filter(e => e.cat === id).sort((a, b) => b.ts - a.ts);
  const wins = winsOf(id), sp = spentOf(id), inn = rawInOf(id), bal = Math.round((wins - inn) * 100) / 100;
  const o = openSheet(`<h3>${esc(c.emoji)} ${esc(c.name)} <button class="icon-btn" id="x">✕</button></h3>
    <div class="meta" style="margin-bottom:${c.tracker ? 4 : 8}px"><span>${c.tracker ? 'Metido ' + fmt(inn) + ' · Pérdida' : 'Gastado'} ${fmt(sp)}</span><span>Quedan ${fmt(availOf(c) - sp)}</span></div>
    ${c.tracker ? `<div class="meta" style="margin-bottom:8px"><span>Ganado ${fmt(wins)}</span><b style="color:${bal >= 0 ? 'var(--ok)' : 'var(--bad)'}">Balance ${sgn(bal)}</b></div>` : ''}
    ${list.length ? list.map(e => { const out = e.kind === 'out'; return `<div class="exp"><div><span style="color:${out ? 'var(--ok)' : 'inherit'}">${out ? '+' : ''}${fmt(e.amount)}${out ? ' ganado' : (c.tracker ? ' metido' : '')}</span>${e.shared ? ' 👥' : ''}<small>${new Date(e.ts).toLocaleDateString('es-ES', {day: 'numeric', month: 'short'})}${e.note ? ' · ' + esc(e.note) : ''}${e.shared ? ' · Tricount −' + fmt(half(e.amount)) : ''}</small></div><div><button data-edit="${esc(e.id)}" aria-label="Editar" style="background:none;border:0;color:var(--txt);padding:6px;font-size:18px">✏️</button><button data-del="${esc(e.id)}" aria-label="Borrar">🗑️</button></div></div>`; }).join('') : '<div class="empty">Aún no hay movimientos este mes</div>'}
    ${c.tracker ? (invBlocked(c) ? `<div style="color:var(--bad);padding:10px;text-align:center;font-weight:600;border-radius:12px;background:var(--card2);margin-top:12px">⛔ Límite de pérdida alcanzado (${fmt(availOf(c))}). Registra ganancias para seguir invirtiendo</div><button class="btn sec" id="addOut">🏆 Gano / retiro</button>` : `<button class="btn" id="addIn">💸 Meto dinero</button><button class="btn sec" id="addOut">🏆 Gano / retiro</button>`) : `<button class="btn" id="add">➕ Añadir gasto aquí</button>`}`);
  o.querySelector('#x').onclick = closeSheet;
  if (c.tracker) {
    const addInBtn = o.querySelector('#addIn');
    if (addInBtn) addInBtn.onclick = () => addSheet(id, 'in');
    o.querySelector('#addOut').onclick = () => addSheet(id, 'out');
  } else o.querySelector('#add').onclick = () => addSheet(id);
  o.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editExpense(b.dataset.edit, id));
  o.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('¿Borrar este movimiento?')) return;
    S.expenses = S.expenses.filter(e => e.id !== b.dataset.del);
    save(); render(); catSheet(id);
  });
}

// ---------- Deudas ----------
function debtForm(id, dirPre) {
  const d = id ? S.debts.find(x => x.id === id) : null;
  let dir = d ? d.dir : (dirPre || 'owed');
  const o = openSheet(`<h3>${d ? 'Editar deuda' : 'Nueva deuda'} <button class="icon-btn" id="x">✕</button></h3>
    <div class="chips"><button class="chip" data-dir="owed">👋 Me deben</button><button class="chip" data-dir="owe">💳 Debo</button></div>
    <input type="text" id="person" placeholder="Persona" value="${esc(d ? d.person : '')}">
    <input type="text" id="concept" placeholder="Concepto (opcional)" value="${esc(d ? d.concept : '')}">
    <input type="number" id="amt" inputmode="decimal" step="0.01" placeholder="Importe (€)" value="${d ? d.amount : ''}">
    <input type="date" id="dd" value="${dayStr(d ? d.ts : Date.now())}">
    <button class="btn" id="ok">Guardar</button>`);
  const refresh = () => o.querySelectorAll('[data-dir]').forEach(b => b.classList.toggle('on', b.dataset.dir === dir));
  o.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => { dir = b.dataset.dir; refresh(); });
  refresh();
  o.querySelector('#x').onclick = closeSheet;
  o.querySelector('#ok').onclick = () => {
    const person = o.querySelector('#person').value.trim();
    const amount = parseFloat(String(o.querySelector('#amt').value).replace(',', '.'));
    if (!person) return o.querySelector('#person').focus();
    if (!(amount > 0)) return o.querySelector('#amt').focus();
    const dv = o.querySelector('#dd').value;
    const ts = dv ? new Date(dv + 'T12:00:00').getTime() : Date.now();
    const concept = o.querySelector('#concept').value.trim();
    if (d) Object.assign(d, {dir, person, concept, amount: rd(amount), ts});
    else S.debts.push({id: uid(), dir, person, concept, amount: rd(amount), ts, payments: []});
    debtTab = dir;
    save(); closeSheet(); render();
    if (d) debtSheet(d.id); else toast('✅ Deuda guardada', 'var(--ok)');
  };
  setTimeout(() => o.querySelector('#person').focus(), 150);
}

function debtSheet(id) {
  const d = S.debts.find(x => x.id === id); if (!d) return;
  const owed = d.dir === 'owed', left = debtLeft(d), paid = debtPaid(d);
  const pays = d.payments.slice().sort((a, b) => b.ts - a.ts);
  const o = openSheet(`<h3>${owed ? '👋' : '💳'} ${esc(d.person)} <button class="icon-btn" id="x">✕</button></h3>
    <div class="meta" style="margin-bottom:4px"><span>${esc(d.concept || 'Sin concepto')} · ${dShort(d.ts)}</span><span>Total ${fmt(d.amount)}</span></div>
    <div class="meta" style="margin-bottom:8px"><span>${owed ? 'Cobrado' : 'Pagado'} ${fmt(paid)}</span><b style="color:${left > 0 ? 'var(--warn)' : 'var(--ok)'}">${left > 0 ? 'Pendiente ' + fmt(left) : '✅ Saldada'}</b></div>
    ${pays.map(p => `<div class="exp"><div><span>${fmt(p.amount)}</span><small>${dShort(p.ts)} · ${p.budget ? (owed ? 'suma al presupuesto' : 'cuenta como gasto') : 'aparte del presupuesto'}</small></div><button data-delp="${esc(p.id)}" aria-label="Borrar pago">🗑️</button></div>`).join('') || '<div class="empty">Sin pagos todavía</div>'}
    ${left > 0 ? `<button class="btn" id="pay">${owed ? '💰 Registrar cobro / saldar' : '💸 Registrar pago / saldar'}</button>` : ''}
    <button class="btn sec" id="edit">✏️ Editar deuda</button>
    <button class="btn danger" id="del" style="margin-top:8px">🗑️ Eliminar deuda</button>`);
  o.querySelector('#x').onclick = closeSheet;
  if (left > 0) o.querySelector('#pay').onclick = () => paySheet(id);
  o.querySelector('#edit').onclick = () => debtForm(id);
  o.querySelector('#del').onclick = () => {
    if (!confirm('¿Eliminar esta deuda y sus pagos?')) return;
    S.debts = S.debts.filter(x => x.id !== id);
    save(); closeSheet(); render();
  };
  o.querySelectorAll('[data-delp]').forEach(b => b.onclick = () => {
    if (!confirm('¿Borrar este pago?')) return;
    d.payments = d.payments.filter(p => p.id !== b.dataset.delp);
    save(); render(); debtSheet(id);
  });
}

function paySheet(id) {
  const d = S.debts.find(x => x.id === id); if (!d) return;
  const owed = d.dir === 'owed', left = debtLeft(d);
  const o = openSheet(`<h3>${owed ? 'Registrar cobro' : 'Registrar pago'} <button class="icon-btn" id="x">✕</button></h3>
    <div class="meta" style="margin-bottom:8px"><span>${esc(d.person)}</span><span>Pendiente ${fmt(left)}</span></div>
    <input type="number" id="amt" inputmode="decimal" step="0.01" value="${left}">
    <label class="share"><input type="checkbox" id="bud"><span>${owed ? '➕ Sumar al presupuesto del mes' : '➖ Contar como gasto del mes'}<small id="info"></small></span></label>
    <button class="btn" id="ok">Guardar</button>`);
  const amtOf = () => parseFloat(String(o.querySelector('#amt').value).replace(',', '.'));
  const refresh = () => {
    const a = amtOf() > 0 ? amtOf() : 0, on = o.querySelector('#bud').checked;
    o.querySelector('#info').textContent = !on ? 'Queda aparte: no cambia tu presupuesto'
      : (owed ? 'Tu dinero del mes subirá ' : 'Tu dinero del mes bajará ') + fmt(a);
  };
  o.querySelector('#bud').onchange = refresh;
  o.querySelector('#amt').oninput = refresh;
  refresh();
  o.querySelector('#x').onclick = () => debtSheet(id);
  o.querySelector('#ok').onclick = () => {
    const a = amtOf();
    if (!(a > 0)) return o.querySelector('#amt').focus();
    if (a > left + 0.005) return toast(`Máximo pendiente: ${fmt(left)}`, 'var(--warn)');
    d.payments.push({id: uid(), amount: rd(a), ts: Date.now(), budget: o.querySelector('#bud').checked});
    save(); render(); debtSheet(id);
    toast(debtLeft(d) <= 0 ? '✅ Deuda saldada' : `✅ Pago guardado. Pendiente ${fmt(debtLeft(d))}`, 'var(--ok)');
  };
  setTimeout(() => o.querySelector('#amt').select(), 150);
}

function settingsSheet() {
  const o = openSheet(`<h3>Ajustes <button class="icon-btn" id="x">✕</button></h3>
    <h2><span>💰 Dinero del mes</span></h2>
    <div class="set-row"><input type="number" step="0.01" id="income" value="${S.income}" style="flex:1"></div>
    <h2><span>🔒 Obligatorios</span><span style="text-transform:none">cuenta ☑</span></h2>
    ${S.fixed.map(f => `<div class="set-row" data-f="${esc(f.id)}"><input type="text" value="${esc(f.name)}" data-k="name"><input type="number" step="0.01" value="${f.amount}" data-k="amount"><label>☑<input type="checkbox" data-k="counted" ${f.counted ? 'checked' : ''}></label><button class="icon-btn" data-delf="${esc(f.id)}">🗑️</button></div>`).join('')}
    <button class="btn sec" id="addF">➕ Añadir obligatorio</button>
    <h2><span>💸 Variables</span><span style="text-transform:none">acumula ↻ · juego 🎰</span></h2>
    ${S.cats.map(c => `<div class="set-row" data-c="${esc(c.id)}"><input type="text" value="${esc(c.name)}" data-k="name"><input type="number" step="0.01" value="${c.budget}" data-k="budget"><label>↻<input type="checkbox" data-k="carry" ${c.carry ? 'checked' : ''}></label><label>🎰<input type="checkbox" data-k="tracker" ${c.tracker ? 'checked' : ''}></label><button class="icon-btn" data-delc="${esc(c.id)}">🗑️</button></div>`).join('')}
    <button class="btn sec" id="addC">➕ Añadir categoría</button>
    <h2><span>💳 Tricount (lo que debo a mi pareja)</span></h2>
    <div class="set-row"><input type="number" step="0.01" id="trbase" value="${S.tricount.base}" style="flex:1"></div>
    <div class="meta" style="margin:-2px 2px 8px"><span>Ahora debes ${fmt(tricountDebt())} (descontados ${fmt(sharedOffset())} de gastos compartidos)</span></div>
    <h2><span>📌 Recordatorios mes que viene</span></h2>
    ${S.reminders.map(r => `<div class="set-row" data-r="${esc(r.id)}"><input type="text" value="${esc(r.name)}" data-k="name"><input type="number" step="0.01" value="${r.amount}" data-k="amount"><button class="icon-btn" data-delr="${esc(r.id)}">🗑️</button></div>`).join('')}
    <button class="btn sec" id="addR">➕ Añadir recordatorio</button>
    <h2><span>Datos</span></h2>
    <button class="btn sec" id="exp">⬇️ Exportar copia (JSON)</button>
    <button class="btn sec" id="imp">⬆️ Importar copia</button>
    <button class="btn danger" id="rst">Vaciar gastos del mes</button>
    <input type="file" id="file" accept="application/json" hidden>`);
  o.querySelector('#x').onclick = () => { closeSheet(); render(); };
  o.querySelectorAll('[data-f] input').forEach(i => i.onchange = () => {
    const f = S.fixed.find(x => x.id === i.closest('[data-f]').dataset.f);
    if (i.dataset.k === 'amount') f.amount = parseFloat(i.value) || 0;
    else if (i.dataset.k === 'counted') f.counted = i.checked;
    else f.name = i.value;
    save();
  });
  o.querySelector('#income').onchange = e => { S.income = parseFloat(e.target.value) || 0; save(); };
  o.querySelector('#trbase').onchange = e => { S.tricount.base = parseFloat(e.target.value) || 0; save(); settingsSheet(); };
  o.querySelectorAll('[data-r] input').forEach(i => i.onchange = () => {
    const r = S.reminders.find(x => x.id === i.closest('[data-r]').dataset.r);
    if (i.dataset.k === 'amount') r.amount = parseFloat(i.value) || 0; else r.name = i.value; save();
  });
  o.querySelectorAll('[data-delr]').forEach(b => b.onclick = () => { S.reminders = S.reminders.filter(x => x.id !== b.dataset.delr); save(); settingsSheet(); });
  o.querySelector('#addR').onclick = () => { S.reminders.push({id: uid(), emoji: '📌', name: 'Nuevo', amount: 0}); save(); settingsSheet(); };
  o.querySelectorAll('[data-c] input').forEach(i => i.onchange = () => {
    const c = S.cats.find(x => x.id === i.closest('[data-c]').dataset.c);
    if (i.dataset.k === 'budget') c.budget = parseFloat(i.value) || 0;
    else if (i.dataset.k === 'carry') c.carry = i.checked;
    else if (i.dataset.k === 'tracker') c.tracker = i.checked;
    else c.name = i.value;
    save();
  });
  o.querySelectorAll('[data-delf]').forEach(b => b.onclick = () => { if (confirm('¿Quitar este obligatorio?')) { S.fixed = S.fixed.filter(x => x.id !== b.dataset.delf); save(); settingsSheet(); } });
  o.querySelectorAll('[data-delc]').forEach(b => b.onclick = () => { if (confirm('¿Quitar categoría y sus gastos del mes?')) { S.cats = S.cats.filter(x => x.id !== b.dataset.delc); S.expenses = S.expenses.filter(e => e.cat !== b.dataset.delc); save(); settingsSheet(); } });
  o.querySelector('#addF').onclick = () => { S.fixed.push({id: uid(), emoji: '🔒', name: 'Nuevo', amount: 0, counted: true, paid: false}); save(); settingsSheet(); };
  o.querySelector('#addC').onclick = () => { S.cats.push({id: uid(), emoji: '🏷️', name: 'Nueva', budget: 0, carry: false, roll: 0}); save(); settingsSheet(); };
  o.querySelector('#exp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}));
    a.download = 'presupuesto-' + S.month + '.json'; a.click();
  };
  o.querySelector('#imp').onclick = () => o.querySelector('#file').click();
  o.querySelector('#file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      try { const d = JSON.parse(t); if (!d.cats || !d.fixed) throw 0; S = d; normalize(); rollover(); save(); closeSheet(); render(); toast('Copia importada', 'var(--ok)'); }
      catch (err) { alert('Archivo no válido'); }
    });
  };
  o.querySelector('#rst').onclick = () => { if (confirm('¿Borrar todos los gastos de este mes?')) { S.expenses = []; save(); closeSheet(); render(); } };
}

document.getElementById('btnAdd').onclick = () => addSheet();
document.getElementById('btnSettings').onclick = settingsSheet;
document.getElementById('app').addEventListener('click', e => {
  const dt = e.target.closest('[data-dtab]'); if (dt) { debtTab = dt.dataset.dtab; return render(); }
  if (e.target.closest('[data-adddebt]')) return debtForm(null, debtTab);
  const db = e.target.closest('[data-debt]'); if (db) return debtSheet(db.dataset.debt);
  const c = e.target.closest('[data-cat]'); if (c) return catSheet(c.dataset.cat);
  const f = e.target.closest('[data-fix]');
  if (f) { const x = S.fixed.find(y => y.id === f.dataset.fix); if (x) { x.paid = !x.paid; save(); render(); } }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { rollover(); save(); render(); } });

load(); render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
